
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaar Win - Live Player Screen</title>
    <!-- Tailwind CSS (डिजाइन सुंदर बनाने के लिए) -->
    <script src="https://jsdelivr.net"></script>
    <!-- Firebase की सही और वर्किंग स्क्रिप्ट्स -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="max-w-md mx-auto bg-gray-100 min-h-screen flex flex-col justify-between shadow-2xl">

    <!-- हेडर -->
    <div class="bg-[#1cc293] p-4 text-white text-center font-bold text-xl rounded-b-2xl shadow-md">
        Yaar Win
    </div>

    <!-- गेम इन्फो और टाइमर बॉक्स -->
    <div class="p-4 mx-4 mt-4 bg-white rounded-xl border border-emerald-100 shadow-sm">
        <div class="flex justify-between items-center mb-3">
            <div>
                <p class="text-xs text-gray-400 font-medium">वॉलेट बैलेंस</p>
                <p class="text-2xl font-black text-emerald-600">₹<span id="balance">100.00</span></p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400 font-medium">समय शेष</p>
                <p class="text-2xl font-mono font-bold text-red-500 bg-red-50 px-3 py-1 rounded-lg border border-red-100" id="timer">00:30</p>
            </div>
        </div>
        <div class="pt-2 border-t border-gray-100 flex justify-between items-center">
            <p class="text-xs text-gray-500 font-semibold font-mono">🏆 पीरियड नंबर: <span id="period" class="text-gray-700">20261001001</span></p>
        </div>
    </div>

    <!-- कलर बटन्स (Betting Buttons) -->
    <div class="p-4 grid grid-cols-3 gap-3">
        <button onclick="placeBet('हरा', 10)" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition text-white font-extrabold py-4 rounded-xl shadow-md cursor-pointer text-center">हरा</button>
        <button onclick="placeBet('बैंगनी', 10)" class="bg-purple-500 hover:bg-purple-600 active:scale-95 transition text-white font-extrabold py-4 rounded-xl shadow-md cursor-pointer text-center">बैंगनी</button>
        <button onclick="placeBet('लाल', 10)" class="bg-rose-500 hover:bg-rose-600 active:scale-95 transition text-white font-extrabold py-4 rounded-xl shadow-md cursor-pointer text-center">लाल</button>
    </div>

    <!-- लाइव नतीजा बॉक्स -->
    <div class="p-4 flex-1">
        <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm h-full flex flex-col justify-center">
            <p class="text-xs font-bold text-gray-400 mb-3 text-center tracking-wider uppercase">📊 लाइव गेम का विजेता 📊</p>
            <div id="resultBox" class="text-center font-bold text-gray-600 bg-gray-50 p-6 rounded-xl border border-gray-200">
                अगले राउंड का इंतजार करें...
            </div>
        </div>
    </div>

    <!-- बॉटम नेविगेशन (असली ऐप जैसा लुक देने के लिए) -->
    <div class="bg-white border-t border-gray-200 p-2 grid grid-cols-4 text-center text-xs text-gray-500">
        <div class="font-bold text-emerald-500 cursor-pointer">🏠 होम</div>
        <div class="font-bold cursor-pointer">🎮 विंगो</div>
        <div class="font-bold cursor-pointer">📈 रिकॉर्ड</div>
        <div class="font-bold cursor-pointer">👤 प्रोफाइल</div>
    </div>

    <script>
        // आपके प्रोजेक्ट का नाम 'rahulgupta808156' के आधार पर सही URL सेटअप
        const firebaseConfig = {
            databaseURL: "rahulgupta808156-crypto"
        };
        
        // Firebase को शुरू करना
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let walletBalance = 100.00;
        let timeLeft = 30;
        let currentPeriod = 20261001001;
        let nextNumber = "--";
        let nextColor = "लोड हो रहा है...";

        // डेटाबेस से लाइव नतीजा पढ़ना (जो आप एडमिन पैनल से बदलेंगे)
        database.ref('gameResult').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                nextNumber = data.number !== undefined ? data.number : "--";
                nextColor = data.color !== undefined ? data.color : "लाल/हरा";
            }
        });

        const timerElement = document.getElementById('timer');
        const resultBox = document.getElementById('resultBox');
        const periodElement = document.getElementById('period');
        const balanceElement = document.getElementById('balance');

        // बेट लगाने का फंक्शन
        function placeBet(color, amount) {
            if (walletBalance >= amount) {
                walletBalance -= amount;
                balanceElement.innerText = walletBalance.toFixed(2);
                alert(`सफलतापूर्वक ₹${amount} की बेट ${color} रंग पर लग गई है!`);
            } else {
                alert("माफ करें! आपका वॉलेट बैलेंस कम है।");
            }
        }

        // 30 सेकंड का गेम टाइमर लूप
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                timerElement.innerText = `00:${seconds}`;
            } else {
                // टाइमर 0 होते ही विजेता स्क्रीन पर आएगा
                resultBox.innerHTML = `
                    <div class="text-gray-400 text-xs font-bold mb-2">पीरियड ${currentPeriod} का परिणाम:</div>
                    <div class="flex items-center justify-center gap-3">
                        <span class="text-4xl font-black text-slate-800 bg-white px-4 py-2 rounded-lg shadow border border-gray-100">${nextNumber}</span> 
                        <span class="text-xl font-extrabold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">${nextColor}</span>
                    </div>
                `;
                timeLeft = 30; 
                currentPeriod++;
                periodElement.innerText = currentPeriod;
            }
        }, 1000);
    </script>
</body>
</html>
