
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaar Win - Player Screen (LIVE)</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">

    <!-- हेडर -->
    <div class="bg-[#1cc293] p-4 text-white text-center font-bold text-xl rounded-b-2xl">
        Yaar Win
    </div>

    <!-- गेम इन्फो और टाइमर -->
    <div class="p-4 mx-4 mt-4 bg-emerald-50 rounded-xl border border-emerald-200">
        <div class="flex justify-between items-center mb-2">
            <div>
                <p class="text-xs text-gray-500">वॉलेट बैलेंस</p>
                <p class="text-2xl font-bold text-emerald-700">₹<span id="balance">100.00</span></p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500">समय शेष</p>
                <p class="text-2xl font-mono font-bold text-red-500" id="timer">00:30</p>
            </div>
        </div>
        <p class="text-xs text-gray-600 font-mono">पीरियड नंबर: <span id="period">20261001001</span></p>
    </div>

    <!-- कलर बटन्स -->
    <div class="p-4 grid grid-cols-3 gap-3">
        <button class="bg-green-500 text-white font-bold py-3 rounded-lg shadow">हरा</button>
        <button class="bg-purple-500 text-white font-bold py-3 rounded-lg shadow">बैंगनी</button>
        <button class="bg-red-500 text-white font-bold py-3 rounded-lg shadow">लाल</button>
    </div>

    <!-- नतीजा बॉक्स -->
    <div class="p-4 flex-1">
        <div class="bg-slate-50 p-4 rounded-xl border border-gray-200">
            <p class="text-sm font-semibold text-gray-700 mb-2 text-center">🔴 लाइव गेम का नतीजा 🔴</p>
            <div id="resultBox" class="text-center font-bold text-lg text-emerald-600 bg-white p-4 rounded-lg shadow-sm border border-emerald-100">
                अगले राउंड का इंतजार करें...
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "rahulgupta808156-crypto"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let timeLeft = 30;
        let currentPeriod = 20261001001;
        let nextNumber = "--";
        let nextColor = "लोड हो रहा है...";

        // डेटाबेस से लाइव नतीजा पढ़ना
        database.ref('gameResult').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                nextNumber = data.number;
                nextColor = data.color;
            }
        });

        const timerElement = document.getElementById('timer');
        const resultBox = document.getElementById('resultBox');
        const periodElement = document.getElementById('period');

        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                timerElement.innerText = `00:${seconds}`;
            } else {
                // टाइमर 0 होते ही वही नंबर दिखेगा जो आपने एडमिन से सेट किया था
                resultBox.innerHTML = `
                    <div class="text-slate-500 text-sm mb-1">पीरियड ${currentPeriod} का आधिकारिक विजेता:</div>
                    <span class="text-3xl font-extrabold text-blue-600">${nextNumber}</span> 
                    <span class="text-xl font-bold ml-2 text-emerald-600">(${nextColor})</span>
                `;
                timeLeft = 30; 
                currentPeriod++;
                periodElement.innerText = currentPeriod;
            }
        }, 1000);
    </script>
</body>
    </html>
